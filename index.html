<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="node_modules/lil-gui/dist/lil-gui.umd.js"></script>
  <!--<script src="node_modules/cesium/Build/Cesium/Cesium.js"></script>-->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="src/mapview.js"></script>
  <script src="src/utils.js"></script>
  <!--<link href="node_modules/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet">-->
  <link href="node_modules/lil-gui/dist/lil-gui.css" rel="stylesheet">
  <style>
    button.cesium-infoBox-camera{
      display: none;
    }
    .cesium-viewer-infoBoxContainer {
      border-radius: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .cesium-infoBox {
      border-radius: 0;
      height:85%;
      overflow-y:auto;
    }
    .cesium-infoBox-title {
      border-radius: 0;
      text-align:left;
    }
    .cesium-infoBox-contents {
      height: 1000px;
      margin: 10px;
    }
  </style>
</head>
<body>
<div id="cesiumContainer"></div>
  <script type="module">
    const viewer = await initializeCesium(); 

    // Fly the camera to Philadelphia at the given longitude, latitude, and height.
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-75.165222, 39.952583, 9000),
      orientation: {
        heading: Cesium.Math.toRadians(0.0),
        pitch: Cesium.Math.toRadians(-89.0),
      }
    });
    
    const data = await getJson("assets/poi.json");
    const gui = initializeGUI(data, viewer);
  </script>
 </div>
 <div class="cesium-viewer-infoBoxContainer">
  <div id="sopInfoBox" class="cesium-infoBox cesium-infoBox-bodiless">
    <div class="cesium-infoBox-title" id="sopInfoBoxTitle">PAFA</div> 
    <button class="cesium-infoBox-close" type="button" onclick="ShowInfoBox(false, null);"> x</button>
    <div class="cesium-infoBox-contents" id="sopInfoBoxContents">
      <!---<img src ="assets/season3/episode5/Lynch and Reavey at the PAFA cafeteria in 1967 - Photo by EO Omwake .jpg" width="100%"/><br><p>David Lynch enrolled at the Pennsylvania Academy of the Fine Arts in late 1965. He received a student deferment that allowed him not to be drafted. At PAFA, Lynch joined his high school friend and roommate Jack Fisk, who had convinced him to come up from Alexandria, Virginia. During the first weeks of the 1966 spring term, Fisk introduced Lynch to Peggy Reavey, also a PAFA student, who had grown up in Chestnut Hill.</p><p>Listen:</p><audio controls src="assets/season3/episode5/Peggy_Meeting David at the PAFA cafeteria.wav"></audio>-->
    </div>
  </div>
 </div>
</body>
</html>
